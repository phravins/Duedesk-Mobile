name: Android build

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'assets/**'
      - 'test/**'
      - 'pubspec.*'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'lib/**'
      - 'android/**'
      - 'assets/**'
      - 'test/**'
      - 'pubspec.*'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Resolve packages
        run: flutter pub get
      # Compiles the Kotlin activity (screenshot blocking, biometric host),
      # the manifest and Gradle setup that the iOS job never touches.
      - name: Build debug APK
        run: flutter build apk --debug --dart-define=APP_ENV=demo
      - uses: actions/upload-artifact@v4
        with:
          name: DueDesk-Android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
