name: duedesk
description: Focused business obligations, deadlines, and evidence.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  go_router: ^17.0.0
  dio: ^5.9.0
  cryptography: ^2.7.0
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^10.0.0
  hive_ce_flutter: ^2.3.1
  path_provider: ^2.1.5
  intl: ^0.20.2
  uuid: ^4.5.1
  file_picker: ^10.3.3
  image_picker: ^1.2.0
  connectivity_plus: ^7.0.0
  flutter_svg: ^2.2.1
  shimmer: ^3.0.0
  timezone: ^0.11.2
  pdfrx: ^2.2.0
  local_auth: ^3.0.2
  flutter_local_notifications: ^22.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  config:
    enable-swift-package-manager: true
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/illustrations/
    - assets/demo/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: NotoSerif
      fonts:
        - asset: assets/fonts/NotoSerif-Medium.ttf
          weight: 500
